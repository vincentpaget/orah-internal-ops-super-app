document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---- Brand & surface ---- */\n  --orah-navy: #002744;          /* top-nav, deep headings */\n  --surface-primary: #0073E6;    /* CTA / primary interactive */\n  --blue-50:  #E3F2FE;\n  --blue-100: #BBDEFB;\n  --blue-200: #8ABFF4;           /* illustration accent (location icon fills) */\n  --blue-600: #0069D1;           /* primary hover */\n  --blue-tint-hover: #e6f1fd;    /* sidebar active-item background */\n  --blue-deep-active: #003F7F;   /* sidebar active-item text */\n\n  /* Family (parent portal) accent */\n  --family-purple:       #8255B1;\n  --family-purple-light: #EDE7F4;\n\n  /* ---- Neutrals (Grey scale) ---- */\n  --grey-50:  #FAFAFA;   /* page background */\n  --grey-100: #F5F5F5;\n  --grey-200: #EEEEEE;   /* hairline borders on cards */\n  --grey-300: #E0E0E0;   /* input borders */\n  --grey-400: #BDBDBD;\n  --grey-500: #9E9E9E;   /* icons, meta text */\n  --grey-600: #757575;\n  --grey-700: #434343;   /* body on light */\n  --grey-800: #262626;   /* high-emphasis text */\n\n  /* ---- Semantic / status ---- */\n  --success: #2E7D32;\n  --success-bg: #E8F5E9;\n  --warning: #F57C00;\n  --warning-bg: #FFF3E0;\n  --warning-dot: #FF8D1A;       /* notification dot on family header */\n  --error:   #D32F2F;\n  --error-bg: #FDECEC;\n\n  /* ---- Text on dark (top nav) ---- */\n  --on-dark-primary: rgba(255,255,255,0.96);\n  --on-dark-secondary: rgba(255,255,255,0.60);\n  --on-dark-input-bg: rgba(255,255,255,0.10);\n  --on-dark-input-border: rgba(255,255,255,0.15);\n\n  /* ---- Semantic text (light bg) ----\n     The codebase uses black-alpha values rather than grey tokens for text\n     emphasis on cards — mirror that here. */\n  --fg-strong:   rgba(0,0,0,0.87);  /* titles on cards */\n  --fg-default:  var(--grey-800);   /* body */\n  --fg-muted:    rgba(0,0,0,0.66);  /* nav labels / icons */\n  --fg-subtle:   rgba(0,0,0,0.54);  /* captions, meta on cards */\n  --fg-faint:    rgba(0,0,0,0.09);  /* hairline dividers */\n\n  /* ---- Radii ---- */\n  --radius-default: 6px;   /* buttons, inputs, chips */\n  --radius-card:    10px;  /* cards, kanban columns */\n  --radius-pill:    100px; /* badges, floating buttons */\n\n  /* ---- Layout tokens ---- */\n  --sidebar-width:           256px;\n  --sidebar-width-collapsed: 56px;\n  --topnav-height:           56px;\n\n  /* ---- Spacing scale (matches Tailwind spacing used in the codebase) ---- */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n\n  /* ---- Shadows ---- */\n  --shadow-card-hover: 0 1px 2px 0 rgba(0,0,0,0.05);\n  --shadow-popover:    0 8px 24px -4px rgba(0,0,0,0.12),\n                       0 0 0 1px rgba(0,0,0,0.05);\n  --shadow-fab:        0 6px 16px -2px rgba(130,85,177,0.35);\n  --ring-focus:        0 0 0 2px var(--surface-primary);\n  --shadow-sidebar-inset: inset -1px 0 0 0 rgba(0,0,0,0.09);\n\n  /* ---- Font families ---- */\n  --font-sans:      'Sofia Pro', ui-sans-serif, system-ui, -apple-system, sans-serif;\n  --font-open-sans: 'Open Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;\n\n  /* ---- Type scale (values observed in components) ---- */\n  --text-xs:    12px;   /* meta, captions */\n  --text-sm:    14px;   /* body / nav / buttons */\n  --text-base:  16px;   /* header secondary */\n  --text-lg:    18px;   /* page titles inline */\n  --text-xl:    20px;   /* stat values, greeting small */\n  --text-2xl:   24px;   /* family greeting */\n  --text-3xl:   30px;\n  --text-4xl:   36px;\n\n  --leading-tight:  1.2;\n  --leading-normal: 1.5;\n\n  --weight-normal:  400;\n  --weight-medium:  500;\n  --weight-semibold:600;\n  --weight-bold:    700;\n\n  /* ---- Motion ---- */\n  --duration-fast: 150ms;\n  --duration-base: 200ms;\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1);\n}\n\n/* ---- Base resets ---- */\nbody {\n  font-family: var(--font-open-sans);\n  color: var(--grey-800 /\n  --blue-600: #0069D1;           /* primary hover */\n  --blue-tint-hover: #e6f1fd;    /* sidebar active-item background */\n  --blue-deep-active: #003F7F;   /* sidebar active-item text */\n\n  /* Family (parent portal) accent */\n  --family-purple:       #8255B1;\n  --family-purple-light: #EDE7F4;\n\n  /* ---- Neutrals (Grey scale) ---- */\n  --grey-50:  #FAFAFA;   /* page background */\n  --grey-100: #F5F5F5;\n  --grey-200: #EEEEEE;   /* hairline borders on cards */\n  --grey-300: #E0E0E0;   /* input borders */\n  --grey-400: #BDBDBD;\n  --grey-500: #9E9E9E;   /* icons, meta text */\n  --grey-600: #757575;\n  --grey-700: #434343;   /* body on light */\n  --grey-800: #262626;   /* high-emphasis text */\n\n  /* ---- Semantic / status ---- */\n  --success: #2E7D32;\n  --success-bg: #E8F5E9;\n  --warning: #F57C00;\n  --warning-bg: #FFF3E0;\n  --warning-dot: #FF8D1A;       /* notification dot on family header */\n  --error:   #D32F2F;\n  --error-bg: #FDECEC;\n\n  /* ---- Text on dark (top nav) ---- */\n  --on-dark-primary: rgba(255,255,255,0.96);\n  --on-dark-secondary: rgba(255,255,255,0.60);\n  --on-dark-input-bg: rgba(255,255,255,0.10);\n  --on-dark-input-border: rgba(255,255,255,0.15);\n\n  /* ---- Semantic text (light bg) ----\n     The codebase uses black-alpha values rather than grey tokens for text\n     emphasis on cards — mirror that here. */\n  --fg-strong:   rgba(0,0,0,0.87);  /* titles on cards */\n  --fg-default:  var(--grey-800);   /* body */\n  --fg-muted:    rgba(0,0,0,0.66);  /* nav labels / icons */\n  --fg-subtle:   rgba(0,0,0,0.54);  /* captions, meta on cards */\n  --fg-faint:    rgba(0,0,0,0.09);  /* hairline dividers */\n\n  /* ---- Radii ---- */\n  --radius-default: 6px;   /* buttons, inputs, chips */\n  --radius-card:    10px;  /* cards, kanban columns */\n  --radius-pill:    100px; /* badges, floating buttons */\n\n  /* ---- Layout tokens ---- */\n  --sidebar-width:           256px;\n  --sidebar-width-collapsed: 56px;\n  --topnav-height:           56px;\n\n  /* ---- Spacing scale (matches Tailwind spacing used in the codebase) ---- */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n\n  /* ---- Shadows ---- */\n  --shadow-card-hover: 0 1px 2px 0 rgba(0,0,0,0.05);\n  --shadow-popover:    0 8px 24px -4px rgba(0,0,0,0.12),\n                       0 0 0 1px rgba(0,0,0,0.05);\n  --shadow-fab:        0 6px 16px -2px rgba(130,85,177,0.35);\n  --ring-focus:        0 0 0 2px var(--surface-primary);\n  --shadow-sidebar-inset: inset -1px 0 0 0 rgba(0,0,0,0.09);\n\n  /* ---- Font families ---- */\n  --font-sans:      'Sofia Pro', ui-sans-serif, system-ui, -apple-system, sans-serif;\n  --font-open-sans: 'Open Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;\n\n  /* ---- Type scale (values observed in components) ---- */\n  --text-xs:    12px;   /* meta, captions */\n  --text-sm:    14px;   /* body / nav / buttons */\n  --text-base:  16px;   /* header secondary */\n  --text-lg:    18px;   /* page titles inline */\n  --text-xl:    20px;   /* stat values, greeting small */\n  --text-2xl:   24px;   /* family greeting */\n  --text-3xl:   30px;\n  --text-4xl:   36px;\n\n  --leading-tight:  1.2;\n  --leading-normal: 1.5;\n\n  --weight-normal:  400;\n  --weight-medium:  500;\n  --weight-semibold:600;\n  --weight-bold:    700;\n\n  /* ---- Motion ---- */\n  --duration-fast: 150ms;\n  --duration-base: 200ms;\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1);\n}\n\n/* ---- Base resets ---- */\nbody {\n  font-family: var(--font-open-sans);\n  color: var(--grey-800);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n/* ==========================================================================\n   Semantic type utilities — use instead of one-off class chains\n   ========================================================================== */\n\n.orah- opportunity. Select a stage to see its details.<\u002Fp>\n    <\u002Fdiv>\n    <section style=\"background:#fff;border:1px solid #EEEEEE;border-radius:10px;overflow:hidden\">\n      <div ref=\"{{ fitRef }}\" style=\"padding:32px 24px\">\n        <div style=\"position:relative;height:{{ diag.h }}px\">\n        <div style=\"position:absolute;top:0;left:{{ diag.x }}px;width:1440px;height:696px;transform-origin:0 0;transform:scale({{ diag.s }})\">\n          <svg width=\"1440\" height=\"696\" sc-camel-view-box=\"0 0 1440 696\" style=\"position:absolute;left:0;top:0;overflow:visible\">\n            <g stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n              <path d=\"M240 348H396M391 343l5 5-5 5M640 348H796M791 343l5 5-5 5\" stroke=\"#434343\"><\u002Fpath>\n              <path d=\"M1040 348H1196M1191 343l5 5-5 5\" stroke=\"#2E7D32\"><\u002Fpath>\n              <path d=\"M120 296V92M115 97l5-5 5 5M520 296V92M515 97l5-5 5 5M920 296V92M915 97l5-5 5 5\" stroke=\"#B35A00\"><\u002Fpath>\n              <path d=\"M120 400V604M115 599l5 5 5-5M520 400V604M515 599l5 5 5-5M920 400V604M915 599l5 5 5-5\" stroke=\"#D32F2F\"><\u002Fpath>\n              \n            <\u002Fg>\n          <\u002Fsvg>\n          <div sc-camel-on-click=\"{{ pick.nurture }}\" style=\"position:absolute;left:0;top:0;width:1040px;height:88px;box-sizing:border-box;border:1px solid #F57C00;background:#FFF3E0;border-radius:10px;cursor:pointer;box-shadow:{{ ring.nurture }};transition:box-shadow 150ms;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px\">\n            <span style=\"font-size:18px;font-weight:700;color:#B35A00\">Nurture<\u002Fspan>\n            <span style=\"font-size:14px;color:#8A4500\">Valid lead, not now. Send back to marketing.<\u002Fspan>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ pick.disqualified }}\" style=\"position:absolute;left:0;top:608px;width:1040px;height:88px;box-sizing:border-box;border:1px solid #D32F2F;background:#FFEBEE;border-radius:10px;cursor:pointer;box-shadow:{{ ring.disqualified }};transition:box-shadow 150ms;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px\">\n            <span style=\"font-size:18px;font-weight:700;color:#B71C1C\">Disqualified<\u002Fspan>\n            <span style=\"font-size:14px;color:#B71C1C\">Not a valid lead.<\u002Fspan>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ pick.new }}\" style=\"position:absolute;left:0;top:296px;width:240px;height:104px;box-sizing:border-box;border:1px solid #002744;background:#fff;border-radius:10px;cursor:pointer;box-shadow:{{ ring.new }};transition:box-shadow 150ms;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px\" style-hover=\"background:#FAFAFA\">\n            <span style=\"font-size:18px;font-weight:700;color:rgba(0,0,0,0.87)\">New<\u002Fspan>\n            <span style=\"font-size:14px;color:rgba(0,0,0,0.66)\">All leads start here<\u002Fspan>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ pick.attempting }}\" style=\"position:absolute;left:400px;top:296px;width:240px;height:104px;box-sizing:border-box;border:1px solid #002744;background:#fff;border-radius:10px;cursor:pointer;box-shadow:{{ ring.attempting }};transition:box-shadow 150ms;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#FAFAFA\">\n            <span style=\"font-size:18px;font-weight:700;color:rgba(0,0,0,0.87)\">Attempting<\u002Fspan>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ pick.connected }}\" style=\"position:absolute;left:800px;top:296px;width:240px;height:104px;box-sizing:border-box;border:1px solid #002744;background:#fff;border-radius:10px;cursor:pointer;box-shadow:{{ ring.connected }};transition:box-shadow 150ms;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#FAFAFA\">\n            <span style=\"font-size:18px;font-weight:700;color:rgba(0,0,0,0.87)\">Connected<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:1200px;top:296px;width:240px;height:104px;box-sizing:border-box;border:1px solid #2E7D32;background:#E8F5E9;border-radius:10px;display:flex;align-items:center;justify-content:center\">\n            <span style=\"font-size: 18px; font-weight: 700; color: rgb(27, 94, 32); text-align: center;\">Qualified<br>(SQL/CSQL)<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"position:absolute;left:320px;top:348px;transform:translate(-50%,-50%);max-width:120px;width:max-content;text-align:center;text-wrap:balance;padding:4px 8px;font-size:12px;line-height:1.35;border-radius:6px;background:#F5F5F5;color:rgba(0,0,0,0.87);box-shadow:0 0 0 3px #fff\">1+ email or call logged<\u002Fspan>\n          <span style=\"position:absolute;left:720px;top:348px;transform:translate(-50%,-50%);max-width:120px;width:max-content;text-align:center;text-wrap:balance;padding:4px 8px;font-size:12px;line-height:1.35;border-radius:6px;background:#F5F5F5;color:rgba(0,0,0,0.87);box-shadow:0 0 0 3px #fff\">1+ reply or call<\u002Fspan>\n          <span style=\"position:absolute;left:1120px;top:348px;transform:translate(-50%,-50%);max-width:120px;width:max-content;text-align:center;text-wrap:balance;padding:4px 8px;font-size:12px;line-height:1.35;border-radius:6px;background:#E8F5E9;color:#1B5E20;box-shadow:0 0 0 3px #fff\">Opp created<\u002Fspan>\n          <span style=\"position:absolute;left:120px;top:168px;transform:translate(-50%,-50%);max-width:180px;width:max-content;text-align:center;text-wrap:balance;padding:4px 8px;font-size:12px;line-height:1.35;border-radius:6px;background:#FFF3E0;color:#8A4500;box-shadow:0 0 0 3px #fff\">Valid, but don't contact now<br>(active support issue, existing opp, recently prospected)<\u002Fspan>\n          <span style=\"position:absolute;left:520px;top:168px;transform:translate(-50%,-50%);max-width:180px;width:max-content;text-align:center;text-wrap:balance;padding:4px 8px;font-size:12px;line-height:1.35;border-radius:6px;background:#FFF3E0;color:#8A4500;box-shadow:0 0 0 3px #fff\">Unresponsive after 21 days, no active sequence<\u002Fspan>\n          <span style=\"position:absolute;left:920px;top:168px;transform:translate(-50%,-50%);max-width:180px;width:max-content;text-align:center;text-wrap:balance;padding:4px 8px;font-size:12px;line-height:1.35;border-radius:6px;background:#FFF3E0;color:#8A4500;box-shadow:0 0 0 3px #fff\">Not now or went quiet (timing, budget, interest)<\u002Fspan>\n          <span style=\"position:absolute;left:120px;top:504px;transform:translate(-50%,-50%);max-width:180px;width:max-content;text-align:center;text-wrap:balance;padding:4px 8px;font-size:12px;line-height:1.35;border-radius:6px;background:#FFEBEE;color:#B71C1C;box-shadow:0 0 0 3px #fff\">Junk, duplicate, not ICP<\u002Fspan>\n          <span style=\"position:absolute;left:520px;top:504px;transform:translate(-50%,-50%);max-width:180px;width:max-content;text-align:center;text-wrap:balance;padding:4px 8px;font-size:12px;line-height:1.35;border-radius:6px;background:#FFEBEE;color:#B71C1C;box-shadow:0 0 0 3px #fff\">Bad contact or opted out<\u002Fspan>\n          <span style=\"position:absolute;left:920px;top:504px;transform:translate(-50%,-50%);max-width:180px;width:max-content;text-align:center;text-wrap:balance;padding:4px 8px;font-size:12px;line-height:1.35;border-radius:6px;background:#FFEBEE;color:#B71C1C;box-shadow:0 0 0 3px #fff\">Wrong person, bad fit or opted out<\u002Fspan>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(0,0,0,0.09);padding:24px;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <span style=\"width:10px;height:10px;border-radius:100px;background:{{ cur.dot }}\"><\u002Fspan>\n          <h2 style=\"margin:0;font-size:18px;font-weight:700;color:rgba(0,0,0,0.87)\">{{ cur.name }}<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h3 style=\"margin:0;font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:rgba(0,0,0,0.54)\">Objective<\u002Fh3>\n            <sc-for list=\"{{ cur.objective }}\" as=\"p\" hint-placeholder-count=\"1\">\n              <p style=\"margin:0;font-size:14px;line-height:1.5;color:rgba(0,0,0,0.87);text-wrap:pretty\">{{ p }}<\u002Fp>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ cur.hasActions }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <h3 style=\"margin:0;font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:rgba(0,0,0,0.54)\">Key Actions<\u002Fh3>\n              <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5;color:rgba(0,0,0,0.87)\">\n                <sc-for list=\"{{ cur.actions }}\" as=\"a\" hint-placeholder-count=\"2\">\n                  <li style=\"text-wrap:pretty\">{{ a }}<\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ cur.hasRes }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <h3 style=\"margin:0;font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:rgba(0,0,0,0.54)\">Resources<\u002Fh3>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{ cur.resources }}\" as=\"r\" hint-placeholder-count=\"1\">\n                  <a href=\"{{ r.url }}\" target=\"_blank\" style=\"display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid #E0E0E0;border-radius:6px;font-size:14px;color:#0073E6;text-decoration:none\" style-hover=\"background:#e6f1fd\">\n                    <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" style=\"flex:none\"><path d=\"M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                    <span>{{ r.name }}<\u002Fspan>\n                  <\u002Fa>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { w: 1440, sel: 'new' };\n  fitRef = React.createRef();\n  componentDidMount() {\n    const el = this.fitRef.current;\n    if (!el) return;\n    this.ro = new ResizeObserver(() => this.setState({ w: el.clientWidth - 48 }));\n    this.ro.observe(el);\n  }\n  componentWillUnmount() { this.ro && this.ro.disconnect(); }\n  renderVals() {\n    const W = 1440, H = 696, s = Math.min(1, Math.max(0.3, this.state.w / W));\n    const D = {\n      new: { name: 'New', dot: '#002744', objective: ['Respond within the required SLA.'],\n        actions: ['Send an email or call, or enroll the lead in a sequence.'], resources: [['Inbound Lead SLA Policy', 'https://app.notion.com/p/Orah-Inbound-Lead-SLA-3cf6511f93c781f58818cb73054b4bd8?source=copy_link']] },\n      attempting: { name: 'Attempting', dot: '#002744', objective: ['Get a response and connect with the lead.'],\n        actions: ['Execute sequence tasks.', 'If not in a sequence, ensure a next task is scheduled.'], resources: [['Lead Follow-Up Sequence Folder', 'https://app.hubspot.com/sequences/20549138/?page=1&folder=272109105']] },\n      connected: { name: 'Connected', dot: '#002744', objective: ['Qualify, disqualify or nurture the lead. The goal is to convert to Qualified, but moving to Nurture or Disqualified matters just as much.', \"Don't let leads sit here if they aren't being worked.\"],\n        actions: ['Confirm fit: right type of school, right person, real interest.', 'Book the Discovery Demo and create the opportunity to move to Qualified.', 'If the timing is wrong, set the reason and move to Nurture.', 'If not a fit, set the disqualification reason and move to Disqualified.', 'Always have a next task scheduled while the lead is here.'], resources: [['How to Create a New Opportunity', '#']] },\n      nurture: { name: 'Nurture', dot: '#F57C00', objective: ['Marketing nurtures the lead and keeps it warm.'],\n        actions: ['Send relevant marketing communications.', 'Leads re-enter the pipeline when they meet the signal criteria.'], resources: [] },\n      disqualified: { name: 'Disqualified', dot: '#D32F2F', objective: ['Suppress the lead from marketing campaigns based on the disqualification reason.'], actions: [], resources: [] }\n    };\n    const sel = this.state.sel, c = D[sel];\n    const pick = {}, ring = {};\n    Object.keys(D).forEach(k => { pick[k] = () => this.setState({ sel: k }); ring[k] = k === sel ? '0 0 0 3px #0073E6' : 'none'; });\n    const cur = { ...c, hasActions: c.actions.length > 0, hasRes: c.resources.length > 0,\n      resources: c.resources.map(([name, url]) => ({ name: !url || url === '#' ? name + ' (TBC)' : name, url })) };\n    return { pick, ring, cur, fitRef: this.fitRef, diag: { s, h: Math.round(H * s), x: Math.max(0, (this.state.w - W * s) / 2) } };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
